<svg width="1200" height="630" viewBox="0 0 1200 630" role="img" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Decathlon Index 2026 — real city walking times</title>
  <desc>Horizontal bar chart showing real walk times from central station to Decathlon across European cities</desc>
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600&amp;family=DM+Mono:wght@400;500&amp;display=swap');
    </style>
  </defs>

  <rect width="1200" height="630" fill="#0D1117"/>

  <text x="80" y="90" font-family="Inter,sans-serif" font-size="60" font-weight="600" fill="#E6EDF3" letter-spacing="-1">Decathlon Index 2026</text>
  <text x="80" y="128" font-family="Inter,sans-serif" font-size="22" fill="#3B82F6" letter-spacing="0.04em">Walk time: central station → nearest Decathlon store</text>

  <line x1="80" y1="150" x2="1120" y2="150" stroke="#21262D" stroke-width="1.5"/>

  <!-- scale: 840px / 119min = 7.059px per min, bars start x=260 -->

  <!-- Bilbao: 4 min × 7.059 = 28px -->
  <text x="80" y="192" font-family="DM Mono,monospace" font-size="21" fill="#8B949E">Bilbao</text>
  <rect x="260" y="174" width="28" height="24" rx="3" fill="#34D399"/>
  <text x="296" y="192" font-family="DM Mono,monospace" font-size="21" fill="#34D399">4 min</text>

  <!-- Liverpool: 9 min × 7.059 = 63px -->
  <text x="80" y="234" font-family="DM Mono,monospace" font-size="21" fill="#8B949E">Liverpool</text>
  <rect x="260" y="216" width="63" height="24" rx="3" fill="#34D399"/>
  <text x="331" y="234" font-family="DM Mono,monospace" font-size="21" fill="#34D399">9 min</text>

  <!-- Cologne: 14 min × 7.059 = 99px -->
  <text x="80" y="276" font-family="DM Mono,monospace" font-size="21" fill="#8B949E">Cologne</text>
  <rect x="260" y="258" width="99" height="24" rx="3" fill="#34D399"/>
  <text x="367" y="276" font-family="DM Mono,monospace" font-size="21" fill="#34D399">14 min</text>

  <!-- Warsaw: 21 min × 7.059 = 148px -->
  <text x="80" y="318" font-family="DM Mono,monospace" font-size="21" fill="#8B949E">Warsaw</text>
  <rect x="260" y="300" width="148" height="24" rx="3" fill="#34D399"/>
  <text x="416" y="318" font-family="DM Mono,monospace" font-size="21" fill="#34D399">21 min</text>

  <!-- Lisbon: 29 min × 7.059 = 205px -->
  <text x="80" y="360" font-family="DM Mono,monospace" font-size="21" fill="#8B949E">Lisbon</text>
  <rect x="260" y="342" width="205" height="24" rx="3" fill="#34D399"/>
  <text x="473" y="360" font-family="DM Mono,monospace" font-size="21" fill="#34D399">29 min</text>

  <!-- Prague: 45 min × 7.059 = 318px -->
  <text x="80" y="402" font-family="DM Mono,monospace" font-size="21" fill="#8B949E">Prague</text>
  <rect x="260" y="384" width="318" height="24" rx="3" fill="#8B949E" opacity="0.4"/>
  <text x="586" y="402" font-family="DM Mono,monospace" font-size="21" fill="#8B949E">45 min</text>

  <!-- Edinburgh: 119 min × 7.059 = 840px -->
  <text x="80" y="444" font-family="DM Mono,monospace" font-size="21" font-weight="500" fill="#F59E0B">Edinburgh</text>
  <rect x="260" y="426" width="840" height="24" rx="3" fill="#F59E0B"/>
  <text x="930" y="444" font-family="DM Mono,monospace" font-size="21" font-weight="500" fill="#0D1117">119 min</text>

  <line x1="80" y1="472" x2="1120" y2="472" stroke="#21262D" stroke-width="1.5"/>

  <rect x="80" y="494" width="18" height="18" rx="3" fill="#34D399"/>
  <text x="106" y="508" font-family="Inter,sans-serif" font-size="18" fill="#34D399">walkable ≤30 min</text>

  <rect x="360" y="494" width="18" height="18" rx="3" fill="#8B949E" opacity="0.4"/>
  <text x="386" y="508" font-family="Inter,sans-serif" font-size="18" fill="#8B949E">30–60 min</text>

  <rect x="580" y="494" width="18" height="18" rx="3" fill="#F59E0B"/>
  <text x="606" y="508" font-family="Inter,sans-serif" font-size="18" fill="#F59E0B">car sewer &gt;60 min</text>

  <text x="80" y="592" font-family="DM Mono,monospace" font-size="22" fill="#3B82F6">decathlonindex.app</text>
  <text x="1120" y="592" font-family="Inter,sans-serif" font-size="18" fill="#3B82F6" text-anchor="end">100 cities · 22 countries</text>
</svg>
